<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Product preview card component for a perfume product."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
    <title>Frontend Mentor | Product preview card component</title>
    <link rel="stylesheet" href="./estilos/estilo.css" />
  </head>

  <body>
    <main class="product-card" aria-label="Product preview card">
      <div class="product-card__image">
        <img
          src="./images/image-product-mobile.jpg"
          alt="Gabrielle Essence perfume bottle"
        />
      </div>

      <section class="product-card__content">
        <p class="product-card__category">Perfume</p>
        <h1 class="product-card__title">Gabrielle Essence Eau De Parfum</h1>
        <p class="product-card__description">
          A floral, solar and voluptuous interpretation composed by Olivier Polge,
          Perfumer-Creator for the House of CHANEL.
        </p>

        <div class="product-card__pricing" aria-label="Product price">
          <span class="product-card__price">$149.99</span>
          <span class="product-card__old-price">$169.99</span>
        </div>

        <button class="product-card__button" type="button" aria-label="Add to cart">
          <img src="./images/icon-cart.svg" alt="" aria-hidden="true" />
          Add to Cart
        </button>
      </section>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noreferrer">
        Frontend Mentor
      </a>.
      Coded by <a href="#">Sebastian Guayara</a>.
    </footer>
  </body>
</html>
